<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcul — Kalkulator Pintar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- ══════════════════════════════════════
         CALCULATOR CARD (Standard Mode)
    ══════════════════════════════════════ -->
    <div class="calculator" id="calculator">

      <!-- Display -->
      <div class="display" id="display">
        <div class="display-expression" id="display-expression"></div>
        <div class="display-main" id="display-main">0</div>
      </div>

      <!-- Button Grid -->
      <div class="btn-grid" id="btn-grid">
        <button class="btn btn-func" data-action="clear" id="btn-ac">AC</button>
        <button class="btn btn-func" data-action="percent">%</button>
        <button class="btn btn-func" data-action="delete">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
        <button class="btn btn-op" data-action="operator" data-value="÷">÷</button>

        <button class="btn btn-num" data-action="number" data-value="7">7</button>
        <button class="btn btn-num" data-action="number" data-value="8">8</button>
        <button class="btn btn-num" data-action="number" data-value="9">9</button>
        <button class="btn btn-op" data-action="operator" data-value="×">×</button>

        <button class="btn btn-num" data-action="number" data-value="4">4</button>
        <button class="btn btn-num" data-action="number" data-value="5">5</button>
        <button class="btn btn-num" data-action="number" data-value="6">6</button>
        <button class="btn btn-op" data-action="operator" data-value="−">−</button>

        <button class="btn btn-num" data-action="number" data-value="1">1</button>
        <button class="btn btn-num" data-action="number" data-value="2">2</button>
        <button class="btn btn-num" data-action="number" data-value="3">3</button>
        <button class="btn btn-op" data-action="operator" data-value="+">+</button>

        <button class="btn btn-num btn-zero" data-action="number" data-value="0">0</button>
        <button class="btn btn-num" data-action="decimal">.</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>

      <!-- NLP Focus Mode Toggle -->
      <button class="nlp-toggle" id="nlp-toggle" aria-label="Buka Mode Asisten">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Tanya dengan kata-kata</span>
        <div class="nlp-toggle-badge">AI</div>
      </button>

    </div><!-- .calculator -->
  </div><!-- .app-wrapper -->


  <!-- ══════════════════════════════════════════
       NLP FOCUS MODE — FULL SCREEN OVERLAY
  ══════════════════════════════════════════ -->
  <div class="nlp-overlay" id="nlp-overlay" aria-hidden="true">

    <!-- Top Header Bar -->
    <div class="nlp-overlay-header">
      <button class="nlp-back-btn" id="nlp-back-btn" aria-label="Kembali ke kalkulator">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Kalkulator</span>
      </button>

      <div class="nlp-overlay-title">
        <div class="nlp-overlay-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a7 7 0 0 1 7 7c0 4-3.5 7-7 9-3.5-2-7-5-7-9a7 7 0 0 1 7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
        </div>
        <div>
          <div class="nlp-overlay-name">Asisten Hitung</div>
          <div class="nlp-overlay-status">
            <span class="nlp-status-dot"></span>aktif
          </div>
        </div>
      </div>

      <button class="nlp-clear-btn" id="nlp-clear-chat-btn" title="Bersihkan chat" aria-label="Hapus riwayat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button>
    </div>

    <!-- Scrollable Chat -->
    <div class="nlp-chat" id="nlp-chat"></div>

    <!-- Quick-Example Chips Tray -->
    <div class="nlp-tray" id="nlp-tray">
      <span class="nlp-tray-label">Coba:</span>
      <div class="nlp-tray-chips">
        <button class="nlp-chip" data-eg="diskon 25 persen dari 200.000">💸 Diskon</button>
        <button class="nlp-chip" data-eg="gaji 5 juta dikurangi kos 1.5 juta makan 800.000 transport 500.000 sisa berapa">💼 Sisa Gaji</button>
        <button class="nlp-chip" data-eg="10 km butuh 1 liter bensin, kalau 80 km berapa liter">⛽ Bensin</button>
        <button class="nlp-chip" data-eg="tagihan 360.000 dibagi rata 4 orang">🍽 Bagi Rata</button>
        <button class="nlp-chip" data-eg="harga barang 450.000 kena pajak ppn 11 persen">🧾 Pajak</button>
        <button class="nlp-chip" data-eg="beli 3 baju masing-masing 75.000 ditambah ongkir 15.000">🛍 Belanja</button>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="nlp-input-area">
      <div class="nlp-textarea-wrap">
        <textarea
          class="nlp-textarea"
          id="nlp-textarea"
          placeholder="Ketik soal cerita di sini… contoh: diskon 20% dari 150.000"
          rows="1"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
      </div>
      <button class="nlp-send-btn" id="nlp-send-btn" aria-label="Kirim">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>

  </div><!-- .nlp-overlay -->

  <script src="script.js"></script>
</body>
</html>
